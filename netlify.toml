[build]
  publish = "."
  functions = "netlify/functions"

# Internal release notes and the archived v4 build are kept in the repository
# but must never be served publicly.
[[redirects]]
  from = "/_internal/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/nexa-v4-netlify/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/api/waitlist"
  to = "/.netlify/functions/client-waitlist"
  status = 200
  force = true

# Pages retired in the 2026 redesign
[[redirects]]
  from = "/thinking/"
  to = "/writing/"
  status = 301
  force = true

[[redirects]]
  from = "/tools/*"
  to = "/pattern-library/"
  status = 301
  force = true

