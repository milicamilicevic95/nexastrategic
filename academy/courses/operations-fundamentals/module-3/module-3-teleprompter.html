<title>Module 3 Teleprompter</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gloock&family=Hanken+Grotesk:wght@400;500;600&display=swap">
<style>
/* Layout: one dark reading field, a fixed reading line at 30% height, a control bar that fades while it runs. Deliberately single-theme dark, like a studio prompter. */
:root{
  --ground:#140808; --text:#fcf4f0; --dim:#9c8580; --cue:#f2a7c4; --line:rgba(192,214,255,.16); --mark:#c0d6ff; --bar:#231111; --edge:#3a1f1d;
  --display:'Gloock', Georgia, serif; --read:'Hanken Grotesk', Arial, sans-serif;
  --size:56px; color-scheme:dark;
}
html,body{height:100%}
body{background:var(--ground);color:var(--text);font-family:var(--read);overflow:hidden}
#field{position:fixed;inset:0;overflow-y:auto;scrollbar-width:none;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#field::-webkit-scrollbar{display:none}
#script{max-width:min(1400px,92vw);margin:0 auto;padding-block:30vh 75vh;display:flex;flex-direction:column;gap:calc(var(--size)*1.4)}
.chapter{font-family:var(--display);font-size:calc(var(--size)*.62);color:var(--mark);border-top:2px solid var(--mark);padding-top:.5em}
.block{display:flex;flex-direction:column;gap:.5em}
.slide{display:flex;gap:.8em;align-items:baseline;font-size:calc(var(--size)*.42);color:var(--dim);letter-spacing:.02em}
.slide b{font-family:var(--display);font-weight:400;font-size:1.6em;color:var(--mark);min-width:1.6em}
.slide .adv{margin-left:auto;font-weight:600;color:var(--mark);white-space:nowrap}
.say{font-size:var(--size);line-height:1.5;font-weight:500;text-wrap:pretty}
.cue{display:inline-block;color:var(--cue);font-weight:600;font-size:.72em;border:2px solid var(--cue);border-radius:.4em;padding:0 .4em;margin:0 .15em;line-height:1.4}
.end{font-family:var(--display);font-size:calc(var(--size)*.8);color:var(--mark);text-align:center}
#readline{position:fixed;left:0;right:0;top:30vh;height:calc(var(--size)*1.6);transform:translateY(-12%);background:var(--line);border-top:2px solid rgba(192,214,255,.35);border-bottom:2px solid rgba(192,214,255,.35);pointer-events:none}
#readline::before{content:"";position:absolute;left:max(6px,env(safe-area-inset-left,0px));top:50%;border:14px solid transparent;border-left:20px solid var(--mark);transform:translateY(-50%)}
#bar{position:fixed;left:0;right:0;bottom:0;background:var(--bar);border-top:1px solid var(--edge);padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;font-size:15px;transition:opacity .4s}
body.running.idle #bar{opacity:0}
#bar .grp{display:flex;align-items:center;gap:6px}
#bar label{color:var(--dim)}
button{font:inherit;color:var(--text);background:#3a1f1d;border:1px solid #5a3532;border-radius:6px;padding:6px 12px;cursor:pointer;min-width:38px}
button:hover{background:#4a2826}
button:focus-visible{outline:2px solid var(--mark);outline-offset:2px}
#play{background:var(--mark);color:#140808;border-color:var(--mark);font-weight:600;min-width:96px}
.val{min-width:3.2em;text-align:center;font-variant-numeric:tabular-nums}
#status{margin-left:auto;color:var(--dim);font-variant-numeric:tabular-nums}
#status b{color:var(--text);font-weight:600}
#keys{color:var(--dim);font-size:13px;width:100%}
#keys kbd{font:inherit;border:1px solid var(--edge);border-radius:4px;padding:0 5px;color:var(--text)}
#intro{max-width:min(1400px,92vw);margin:0 auto 0;color:var(--dim);font-size:18px;line-height:1.5;border:1px solid var(--edge);border-radius:8px;padding:16px 20px}
#intro b{color:var(--text)}
body.camera{--col:420px}
body.camera #script{max-width:min(var(--col),92vw);padding-top:16vh}
body.camera .say{line-height:1.35}
#fade{position:fixed;left:0;right:0;top:calc(16vh + var(--size)*5.8);bottom:0;pointer-events:none;background:linear-gradient(to bottom,rgba(20,8,8,0) 0,rgba(20,8,8,.82) calc(var(--size)*1.6),rgba(20,8,8,.92) 100%);display:none}
#fadeTop{position:fixed;left:0;right:0;top:0;height:calc(16vh - 4px);pointer-events:none;background:linear-gradient(to top,rgba(20,8,8,.55),rgba(20,8,8,.92));display:none}
body.camera.focus #fade,body.camera.focus #fadeTop{display:block}
.camOnly{display:none}
body.camera .camOnly{display:flex}
#focus[aria-pressed="true"]{background:var(--mark);color:#140808;border-color:var(--mark)}
body.camera #readline{top:16vh;left:max(0px,calc(50% - var(--col)/2 - 48px));right:max(0px,calc(50% - var(--col)/2 - 48px))}
body.camera .slide{flex-wrap:wrap;gap:.2em .6em}
body.camera .slide .adv{margin-left:0;width:100%}
body.camera #intro{max-width:min(var(--col),92vw);font-size:16px}
#cam[aria-pressed="true"]{background:var(--mark);color:#140808;border-color:var(--mark)}
@media (max-width:700px){#keys{display:none} :root{--size:34px}}
@media (prefers-reduced-motion:reduce){#bar{transition:none}}
</style>
<div id="field" tabindex="-1">
  <div id="script"></div>
</div>
<div id="readline" aria-hidden="true"></div>
<div id="fadeTop" aria-hidden="true"></div><div id="fade" aria-hidden="true"></div>
<div id="bar" role="toolbar" aria-label="Prompter controls">
  <button id="play" type="button">Start</button>
  <div class="grp"><label>Speed</label><button id="slower" type="button" aria-label="Slower">−</button><span class="val" id="speedVal"></span><button id="faster" type="button" aria-label="Faster">+</button></div>
  <div class="grp"><label>Text</label><button id="smaller" type="button" aria-label="Smaller text">A−</button><button id="bigger" type="button" aria-label="Bigger text">A+</button></div>
  <div class="grp"><button id="prev" type="button">◀ Slide</button><button id="next" type="button">Slide ▶</button><button id="restart" type="button">Restart</button><button id="full" type="button">Full screen</button><button id="cam" type="button" aria-pressed="false">Camera mode</button></div>
  <div class="grp camOnly"><label>Width</label><button id="narrower" type="button" aria-label="Narrower column">−</button><span class="val" id="colVal"></span><button id="wider" type="button" aria-label="Wider column">+</button><button id="focus" type="button" aria-pressed="true">Focus</button></div>
  <div id="status"><span id="slideNow"></span> · <b id="clock">0:00</b></div>
  <div id="keys"><kbd>Space</kbd> start/pause · <kbd>↑</kbd><kbd>↓</kbd> speed · <kbd>←</kbd><kbd>→</kbd> previous/next slide · <kbd>+</kbd><kbd>−</kbd> text size · <kbd>Home</kbd> restart · <kbd>F</kbd> full screen · <kbd>C</kbd> camera mode · <kbd>[</kbd><kbd>]</kbd> column width · <kbd>D</kbd> focus (dims all but the next lines). Scroll by hand any time.</div>
</div>
<script>
const SLIDES = [{"n": 1, "title": "You can be profitable and still miss payroll.", "chapter": "Opening", "text": "[Camera on, slide up.] Hi, welcome back. Quick note before we start: if you see me looking off to the side, it’s because I’m sharing the slides on another screen. So I’m looking at them, not ignoring you. This is module 3, the money. So that’s commercial and finance, the second pair. And the line on this slide is the one I want you to leave with: you can be profitable and still miss payroll. By the end you’ll have your cash, week by week, for the next thirteen weeks, you’ll know when each client actually pays, and you’ll know who your next finance hire should be, or that it’s not yet. About eleven minutes, three chapters, then the worksheet. Just so you know, this isn’t financial advice. It’s what good looks like, and who to talk to."}, {"n": 2, "title": "You get paid in 60 days. You pay out in 14.", "chapter": null, "text": "Okay, let’s start with the gap, because it’s on the slide and most founders don’t see it. You get paid in sixty days, maybe longer. But you pay your team and your suppliers in fourteen, sometimes less. So for every client, you’re paying out weeks before the money comes in. And here’s the bit underneath: every new client makes that gap wider. Which is why growing businesses run out of cash. Not because they’re failing, but because they’re winning work faster than they’re getting paid for it. [Pause.] Have a think about your own numbers. How long do you wait, and how fast do you pay?"}, {"n": 3, "title": "When the money arrives.", "chapter": "Chapter 1 · When the money arrives", "text": "Chapter 1, about three minutes. This is the commercial side: how your prices and your terms decide when the cash actually turns up."}, {"n": 4, "title": "Your terms decide your cash", "chapter": null, "text": "So the commercial panel is where most cash problems actually start, and these are the four things on this slide. Top one: terms in every contract. Say when you get paid, in writing, every time. If you don’t, the client’s terms win, and theirs are usually longer. Second: a deposit up front, so money comes in before you spend on the work. Kestrel should have had that on day one. Third: invoice the day it’s earned. Honestly, I see founders sit on invoices for a week or two because they’re busy, and every day you wait is a day added to the gap. And at the bottom: one person chases. A name, and a day of the week. Not whoever happens to remember."}, {"n": 5, "title": "Kestrel’s three biggest clients", "chapter": null, "text": "Now look at this. These are Kestrel’s three biggest clients, and the numbers are made up, but the pattern isn’t. In the middle, their terms. On the right, when they actually pay. Client B is fine, thirty days, pays in thirty-one. Client A is meant to be thirty and pays in forty-seven. And client C, at the bottom, is sixty days on paper and actually eighty-five. So that’s the line at the bottom: plan on when they pay, not when they should. Your accounting software can usually show you this. If it can’t, look at your last few invoices for each client and the date the money landed. It takes about twenty minutes and it’s one of the most useful things you’ll do this month."}, {"n": 6, "title": "You’re allowed to charge for it.", "chapter": null, "text": "One more thing on the commercial side. In the UK, if another business pays you late, you’re allowed to charge statutory interest. It’s eight percent plus the Bank of England base rate, and you can add a fixed amount to cover the cost of chasing. That’s as at November 2026, and the government is planning to make the rules on late payment tougher. Most founders never use it, and you don’t have to. But putting it in your terms gives you something to point to when you chase. And if a big client is paying you months late, it’s worth knowing the law is on your side."}, {"n": 7, "title": "Profit isn’t cash.", "chapter": "Chapter 2 · Profit isn’t cash", "text": "Chapter 2, about three minutes. This is the finance side: why profit and cash are different, and the one tool that shows you both."}, {"n": 8, "title": "Kestrel in March", "chapter": null, "text": "So here’s Kestrel in March, remember the big contract from module 1? Top row, on paper. They invoiced a hundred and twenty thousand, they spent ninety-five on venues, freelancers and payroll, so that’s twenty-five thousand profit. Great month. Bottom row, in the bank. The ninety-five thousand went out in March. The hundred and twenty comes in May, because of those ninety-day terms. So, as it says at the bottom: profitable in March, short of cash until May. Your profit and loss would tell you March was a great month. Only a cash view tells you it nearly wasn’t."}, {"n": 9, "title": "The 13-week cash view", "chapter": null, "text": "And this is the tool. A thirteen-week cash view. It’s the standard way finance people look at cash, and honestly it’s not complicated. You start with your bank balance today, top row. Then money in: each invoice, in the week it’ll actually land. Not the week it’s due, the week it actually lands, which is why we just did client A, B and C. Then money out: payroll, rent, suppliers, tax, in the week each one goes. And at the bottom, every week, you roll it forward one week. It takes about fifteen minutes once it’s set up. There’s a template with the worksheet, so you’re not starting from a blank spreadsheet."}, {"n": 10, "title": "You see a cash gap weeks before it hits.", "chapter": null, "text": "And this is why you do it. You see a cash gap weeks before it hits. Which means you can do something about it. Chase earlier, ask for a deposit, move a payment, talk to the bank, hold off a hire. When you find out on the day payroll’s due, you’ve got none of those options. When you find out eight weeks ahead, you’ve got all of them."}, {"n": 11, "title": "Tax goes in the cash view too", "chapter": null, "text": "Quick one on tax, because it’s the money-out line founders forget. This is UK, as at November 2026, and it’s just so you recognise it. VAT, top row: you have to register once your taxable turnover passes ninety thousand pounds in any twelve months. Corporation tax: for most companies, it’s due nine months and a day after your year end. Larger companies pay in instalments. PAYE goes every month with payroll. And the bottom one is the habit: set tax aside as the money comes in, in a separate account, so it’s never sitting in your cash looking like it’s yours. Your accountant should confirm exactly what applies to you, and put the dates in your cash view."}, {"n": 12, "title": "Who does the numbers.", "chapter": "Chapter 3 · Who does the numbers", "text": "Chapter 3, about two minutes. Who should be doing all this, and when you actually need a finance hire."}, {"n": 13, "title": "The finance ladder", "chapter": null, "text": "So who does all of this? This is the ladder, from the top. A bookkeeper: keeps the records, sends invoices, reconciles the bank, every week. An accountant: year end, tax, and advice when you ask. A part-time finance director: forecasts, planning, fundraising, usually when you’re raising or planning something big. And a CFO, at the bottom, which is finance strategy at scale, and usually much later than founders think. And the line underneath is the honest bit: most businesses your size need the first two, done well. Not a CFO. If your bookkeeping is a month behind, no finance director in the world can tell you what your cash looks like."}, {"n": 14, "title": "Add one what-if.", "chapter": null, "text": "One last Kestrel bit. When they took the big contract, they hired three freelancers straight away, before the first payment had landed. So the hiring outran the money. And a thirteen-week view with one what-if in it would have shown them that. So that’s the habit on this slide. Add one what-if to your cash view. The one I always ask is underneath: what if your biggest client pays a month late? Move their money four weeks to the right and look at your lowest week. If that week goes below zero, you know what to fix first. And notice how this turns the ball: one late payment hits finance, but also people, because payroll, and risk, because one client."}, {"n": 15, "title": "Your turn · on the worksheet", "chapter": "Close", "text": "Okay, your turn. It’s on the worksheet, with the template. Today: build your thirteen-week cash view. Bank balance, money in by the week it lands, money out by the week it goes. It’ll take about forty-five minutes the first time, less after. Then add one what-if: your biggest client pays a month late. Then your clients: for your top five, write their terms next to when they actually pay. And last, your next finance hire. Bookkeeper, accountant, finance director, or not yet. Write down which, and why."}, {"n": 16, "title": "What would you do if your biggest client paid a month late?", "chapter": null, "text": "Last question, and it’s the one on the slide. What would you do if your biggest client paid a month late? If you’ve got an answer, great. If you haven’t, that’s your first job this week. Get this right and you’ll see a cash gap weeks before it hits. Module 4 is the rules and control, which is the last one before the applied test. See you there."}];
const $ = s => document.querySelector(s);
const field = $('#field'), script = $('#script');
const store = {get(k,d){try{const v=localStorage.getItem('tp1.'+k);return v===null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('tp1.'+k,JSON.stringify(v))}catch(e){}}};
let speed = store.get('speed', 4), size = store.get('size', 56), running = false, last = 0, carry = 0, elapsed = 0, idleTimer;

function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function render(){
  const intro = document.createElement('div');
  intro.id='intro';
  intro.innerHTML='<b>Before you record.</b> In Loom, share only the deck’s window or tab, and keep this prompter on your other screen, so it never appears in the video. Press Start, or Space, when you begin talking. Pink boxes are stage directions, not lines. A blue “change slide” marks where you click to the next slide.';
  script.appendChild(intro);
  SLIDES.forEach((s,i)=>{
    if(s.chapter){const c=document.createElement('div');c.className='chapter';c.textContent=s.chapter;script.appendChild(c)}
    const b=document.createElement('section');b.className='block';b.id='s'+s.n;
    const said=esc(s.text).replace(/\[(.*?)\]/g,'<span class="cue">$1</span>');
    b.innerHTML='<div class="slide"><b>'+s.n+'</b><span>'+esc(s.title)+'</span>'+(i?'<span class="adv">change slide ▶</span>':'')+'</div><p class="say">'+said+'</p>';
    script.appendChild(b);
  });
  const e=document.createElement('p');e.className='end';e.textContent='End of module 3. Stop recording.';script.appendChild(e);
}
// speed levels: px per second at 56px text, scaled with text size
const LEVELS=[0,10,14,18,23,28,34,40,48,58,70];
function pxPerSec(){return LEVELS[speed]*(size/56)}
function applySize(){document.documentElement.style.setProperty('--size',size+'px');store.set('size',size)}
function showSpeed(){$('#speedVal').textContent=speed+' / 10';store.set('speed',speed)}
function blocks(){return [...script.querySelectorAll('.block')]}
function lineY(){return field.clientHeight*(document.body.classList.contains('camera')?0.16:0.30)}
function currentIndex(){const y=lineY()+field.scrollTop;let idx=0;blocks().forEach((b,i)=>{if(b.offsetTop<=y+4)idx=i});return idx}
function updateStatus(){const i=currentIndex();$('#slideNow').textContent='Slide '+SLIDES[i].n+' of '+SLIDES.length;const s=Math.floor(elapsed);$('#clock').textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function goTo(i){const bs=blocks();i=Math.max(0,Math.min(bs.length-1,i));field.scrollTop=bs[i].offsetTop-lineY();carry=0;updateStatus()}
function tick(t){
  if(!running)return;
  const dt=last?Math.min(0.1,(t-last)/1000):0; last=t; elapsed+=dt;
  carry+=pxPerSec()*dt; const whole=Math.floor(carry);
  if(whole){field.scrollTop+=whole;carry-=whole}
  if(field.scrollTop+field.clientHeight>=field.scrollHeight-2){setRunning(false)}
  updateStatus(); requestAnimationFrame(tick);
}
let wake=null;
async function lockScreen(on){try{if(on&&'wakeLock'in navigator){wake=await navigator.wakeLock.request('screen')}else if(wake){await wake.release();wake=null}}catch(e){}}
function setRunning(on){
  running=on; document.body.classList.toggle('running',on);
  $('#play').textContent=on?'Pause':(elapsed?'Resume':'Start');
  last=0; lockScreen(on); if(on){requestAnimationFrame(tick);poke()}
}
function poke(){document.body.classList.remove('idle');clearTimeout(idleTimer);idleTimer=setTimeout(()=>document.body.classList.add('idle'),2500)}
function full(){const d=document;try{if(!d.fullscreenElement)d.documentElement.requestFullscreen().catch(()=>{});else d.exitFullscreen().catch(()=>{})}catch(e){}}
function bump(n){speed=Math.max(1,Math.min(10,speed+n));showSpeed()}
function resize(n){const i=currentIndex();size=Math.max(28,Math.min(110,size+n));applySize();requestAnimationFrame(()=>goTo(i))}

function setCamera(on){const i=currentIndex();document.body.classList.toggle('camera',on);$('#cam').setAttribute('aria-pressed',String(on));store.set('camera',on);requestAnimationFrame(()=>goTo(i))}
let col=store.get('col',420), focus=store.get('focus',true);
function applyCol(){document.documentElement.style.setProperty('--col',col+'px');document.body.style.setProperty('--col',col+'px');$('#colVal').textContent=col+'px';store.set('col',col)}
function setFocus(on){focus=on;document.body.classList.toggle('focus',on);$('#focus').setAttribute('aria-pressed',String(on));store.set('focus',on)}
function widen(n){const i=currentIndex();col=Math.max(220,Math.min(1000,col+n));applyCol();requestAnimationFrame(()=>goTo(i))}
render(); applySize(); applyCol(); setFocus(focus); showSpeed(); document.body.classList.toggle('camera',store.get('camera',false)); $('#cam').setAttribute('aria-pressed',String(store.get('camera',false))); goTo(0);
$('#narrower').onclick=()=>widen(-40); $('#wider').onclick=()=>widen(40); $('#focus').onclick=()=>setFocus(!focus);
$('#cam').onclick=()=>setCamera(!document.body.classList.contains('camera'));
$('#play').onclick=()=>setRunning(!running);
$('#slower').onclick=()=>bump(-1); $('#faster').onclick=()=>bump(1);
$('#smaller').onclick=()=>resize(-6); $('#bigger').onclick=()=>resize(6);
$('#prev').onclick=()=>goTo(currentIndex()-1); $('#next').onclick=()=>goTo(currentIndex()+1);
$('#restart').onclick=()=>{setRunning(false);elapsed=0;goTo(0);$('#play').textContent='Start'};
$('#full').onclick=full;
field.addEventListener('scroll',()=>{if(!running)updateStatus()});
document.addEventListener('mousemove',poke);
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='BUTTON'&&(e.key===' '||e.key==='Enter'))return;
  const k=e.key;
  if(k===' '){e.preventDefault();setRunning(!running)}
  else if(k==='ArrowUp'){e.preventDefault();bump(1)}
  else if(k==='ArrowDown'){e.preventDefault();bump(-1)}
  else if(k==='ArrowRight'){e.preventDefault();goTo(currentIndex()+1)}
  else if(k==='ArrowLeft'){e.preventDefault();goTo(currentIndex()-1)}
  else if(k==='+'||k==='='){resize(6)}
  else if(k==='-'||k==='_'){resize(-6)}
  else if(k==='Home'){e.preventDefault();$('#restart').click()}
  else if(k==='f'||k==='F'){full()}
  else if(k==='['){widen(-40)}
  else if(k===']'){widen(40)}
  else if(k==='d'||k==='D'){setFocus(!focus)}
  else if(k==='c'||k==='C'){setCamera(!document.body.classList.contains('camera'))}
  else return;
  poke();
});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&running)lockScreen(true)});
</script>
