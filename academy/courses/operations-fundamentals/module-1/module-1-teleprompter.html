<title>Module 1 Teleprompter</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gloock&family=Hanken+Grotesk:wght@400;500;600&display=swap">
<style>
/* Layout: one dark reading field, a fixed reading line at 30% height, a control bar that fades while it runs. Deliberately single-theme dark, like a studio prompter. */
:root{
  --ground:#140808; --text:#fcf4f0; --dim:#9c8580; --cue:#f2a7c4; --line:rgba(192,214,255,.16); --mark:#c0d6ff; --bar:#231111; --edge:#3a1f1d;
  --display:'Gloock', Georgia, serif; --read:'Hanken Grotesk', Arial, sans-serif;
  --size:56px; color-scheme:dark;
}
html,body{height:100%}
body{background:var(--ground);color:var(--text);font-family:var(--read);overflow:hidden}
#field{position:fixed;inset:0;overflow-y:auto;scrollbar-width:none;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#field::-webkit-scrollbar{display:none}
#script{max-width:min(1400px,92vw);margin:0 auto;padding-block:30vh 75vh;display:flex;flex-direction:column;gap:calc(var(--size)*1.4)}
.chapter{font-family:var(--display);font-size:calc(var(--size)*.62);color:var(--mark);border-top:2px solid var(--mark);padding-top:.5em}
.block{display:flex;flex-direction:column;gap:.5em}
.slide{display:flex;gap:.8em;align-items:baseline;font-size:calc(var(--size)*.42);color:var(--dim);letter-spacing:.02em}
.slide b{font-family:var(--display);font-weight:400;font-size:1.6em;color:var(--mark);min-width:1.6em}
.slide .adv{margin-left:auto;font-weight:600;color:var(--mark);white-space:nowrap}
.say{font-size:var(--size);line-height:1.5;font-weight:500;text-wrap:pretty}
.cue{display:inline-block;color:var(--cue);font-weight:600;font-size:.72em;border:2px solid var(--cue);border-radius:.4em;padding:0 .4em;margin:0 .15em;line-height:1.4}
.end{font-family:var(--display);font-size:calc(var(--size)*.8);color:var(--mark);text-align:center}
#readline{position:fixed;left:0;right:0;top:30vh;height:calc(var(--size)*1.6);transform:translateY(-12%);background:var(--line);border-top:2px solid rgba(192,214,255,.35);border-bottom:2px solid rgba(192,214,255,.35);pointer-events:none}
#readline::before{content:"";position:absolute;left:max(6px,env(safe-area-inset-left,0px));top:50%;border:14px solid transparent;border-left:20px solid var(--mark);transform:translateY(-50%)}
#bar{position:fixed;left:0;right:0;bottom:0;background:var(--bar);border-top:1px solid var(--edge);padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;font-size:15px;transition:opacity .4s}
body.running.idle #bar{opacity:0}
#bar .grp{display:flex;align-items:center;gap:6px}
#bar label{color:var(--dim)}
button{font:inherit;color:var(--text);background:#3a1f1d;border:1px solid #5a3532;border-radius:6px;padding:6px 12px;cursor:pointer;min-width:38px}
button:hover{background:#4a2826}
button:focus-visible{outline:2px solid var(--mark);outline-offset:2px}
#play{background:var(--mark);color:#140808;border-color:var(--mark);font-weight:600;min-width:96px}
.val{min-width:3.2em;text-align:center;font-variant-numeric:tabular-nums}
#status{margin-left:auto;color:var(--dim);font-variant-numeric:tabular-nums}
#status b{color:var(--text);font-weight:600}
#keys{color:var(--dim);font-size:13px;width:100%}
#keys kbd{font:inherit;border:1px solid var(--edge);border-radius:4px;padding:0 5px;color:var(--text)}
#intro{max-width:min(1400px,92vw);margin:0 auto 0;color:var(--dim);font-size:18px;line-height:1.5;border:1px solid var(--edge);border-radius:8px;padding:16px 20px}
#intro b{color:var(--text)}
body.camera{--col:420px}
body.camera #script{max-width:min(var(--col),92vw);padding-top:16vh}
body.camera .say{line-height:1.35}
#fade{position:fixed;left:0;right:0;top:calc(16vh + var(--size)*5.8);bottom:0;pointer-events:none;background:linear-gradient(to bottom,rgba(20,8,8,0) 0,rgba(20,8,8,.82) calc(var(--size)*1.6),rgba(20,8,8,.92) 100%);display:none}
#fadeTop{position:fixed;left:0;right:0;top:0;height:calc(16vh - 4px);pointer-events:none;background:linear-gradient(to top,rgba(20,8,8,.55),rgba(20,8,8,.92));display:none}
body.camera.focus #fade,body.camera.focus #fadeTop{display:block}
.camOnly{display:none}
body.camera .camOnly{display:flex}
#focus[aria-pressed="true"]{background:var(--mark);color:#140808;border-color:var(--mark)}
body.camera #readline{top:16vh;left:max(0px,calc(50% - var(--col)/2 - 48px));right:max(0px,calc(50% - var(--col)/2 - 48px))}
body.camera .slide{flex-wrap:wrap;gap:.2em .6em}
body.camera .slide .adv{margin-left:0;width:100%}
body.camera #intro{max-width:min(var(--col),92vw);font-size:16px}
#cam[aria-pressed="true"]{background:var(--mark);color:#140808;border-color:var(--mark)}
@media (max-width:700px){#keys{display:none} :root{--size:34px}}
@media (prefers-reduced-motion:reduce){#bar{transition:none}}
</style>
<div id="field" tabindex="-1">
  <div id="script"></div>
</div>
<div id="readline" aria-hidden="true"></div>
<div id="fadeTop" aria-hidden="true"></div><div id="fade" aria-hidden="true"></div>
<div id="bar" role="toolbar" aria-label="Prompter controls">
  <button id="play" type="button">Start</button>
  <div class="grp"><label>Speed</label><button id="slower" type="button" aria-label="Slower">−</button><span class="val" id="speedVal"></span><button id="faster" type="button" aria-label="Faster">+</button></div>
  <div class="grp"><label>Text</label><button id="smaller" type="button" aria-label="Smaller text">A−</button><button id="bigger" type="button" aria-label="Bigger text">A+</button></div>
  <div class="grp"><button id="prev" type="button">◀ Slide</button><button id="next" type="button">Slide ▶</button><button id="restart" type="button">Restart</button><button id="full" type="button">Full screen</button><button id="cam" type="button" aria-pressed="false">Camera mode</button></div>
  <div class="grp camOnly"><label>Width</label><button id="narrower" type="button" aria-label="Narrower column">−</button><span class="val" id="colVal"></span><button id="wider" type="button" aria-label="Wider column">+</button><button id="focus" type="button" aria-pressed="true">Focus</button></div>
  <div id="status"><span id="slideNow"></span> · <b id="clock">0:00</b></div>
  <div id="keys"><kbd>Space</kbd> start/pause · <kbd>↑</kbd><kbd>↓</kbd> speed · <kbd>←</kbd><kbd>→</kbd> previous/next slide · <kbd>+</kbd><kbd>−</kbd> text size · <kbd>Home</kbd> restart · <kbd>F</kbd> full screen · <kbd>C</kbd> camera mode · <kbd>[</kbd><kbd>]</kbd> column width · <kbd>D</kbd> focus (dims all but the next lines). Scroll by hand any time.</div>
</div>
<script>
const SLIDES = [{"n": 1, "title": "Process is one of eight.", "chapter": "Opening", "text": "[Camera on, slide up.] Hi, I’m Mila. I’m a fractional COO, so my job is basically to look at the whole of a business, not just one corner of it. This is module 1, and it’s the frame for everything else we’ll do. If you haven’t got the worksheet open yet, grab it now. You’ll want it at the end."}, {"n": 2, "title": "Would you sign it?", "chapter": null, "text": "Before I explain anything, I want to give you a decision. On this slide is Kestrel. They’re made up, an events agency, about 35 people. Their biggest client has just offered them a full year of events. It’s the biggest deal they’ve ever had. So, would you sign it? [Pause.] Most founders I ask say yes, usually on the call. Keep your answer in your head, because we’re coming back to Kestrel in chapter 3."}, {"n": 3, "title": "How this works.", "chapter": null, "text": "Quickly, how this course works, because it’s all on this slide. On the left, the four modules. This one’s the whole picture, then the work, then the money, then the rules. And at the bottom, the applied test. You’ll do it on Kestrel first, then on your own business, and I’ll review each one. Each module has a worksheet, and they build on each other, so hang on to them. On the right is what you’ll leave with today. Three things: your eight parts mapped with a name on each, your weakest part, and one real decision run past all eight. Right. Let’s get into it."}, {"n": 4, "title": "What operations is.", "chapter": "Chapter 1 · What operations is", "text": "So, chapter 1. This is about five minutes, and it’s just: what actually is operations? Because most founders I work with have never had anyone explain it."}, {"n": 5, "title": "What is operations?", "chapter": null, "text": "This is the question I ask every founder I work with. Have a go before I answer. Pause it if you want. [Pause.] Most people say some version of process. Systems, SOPs, admin, getting things written down. And that’s not wrong. It’s just one part of it. Process is one of eight, and I’ll show you the other seven in a minute."}, {"n": 6, "title": "Everything that makes the business work, behind what the customer sees.", "chapter": null, "text": "So this is the definition I use, and it’s the one we’ll stick with for the whole course. Operations is everything that makes the business work, behind what the customer sees. The customer sees your product, your service, your marketing, you. Everything behind that, so actually delivering, getting paid, staying legal, keeping going, that’s operations. When it works, nobody notices. When it doesn’t, the customer notices pretty quickly. An invoice goes out wrong, a deadline gets missed, a contract says something nobody expected."}, {"n": 7, "title": "You’ve been doing it since your first invoice.", "chapter": null, "text": "And the thing is, you already have operations, even if it’s just you. The first time you agreed a price, sent an invoice or signed a contract, that was operations. Nobody called it that, so nobody really owns it. Which normally means it all lives in your head."}, {"n": 8, "title": "Eight parts, in four pairs", "chapter": null, "text": "Okay, so here are the eight. I call them panels, and you’ll see why in chapter 2. Eight’s a lot to hold, so I put them in four pairs, and that’s what you’re looking at. Top row, the work: process and people. So how the work gets done, and who does it. Then the money: commercial and finance. What you charge, and what actually comes in and goes out. Then the rules: legal and compliance. What you’ve agreed to, and what you have to follow. And the bottom row, control: governance and risk. Who decides, and what could go wrong. So: work, money, rules, control. If you remember those four, you’ll remember the eight. [If you’re on paper: draw four boxes and put two words in each.]"}, {"n": 9, "title": "The gap I look for first, in each part", "chapter": null, "text": "Now, I’m not going to define all eight for you. You know what finance is, and the prompts are on your worksheet. What I want to show you instead is what’s on this slide: the gap I look for first in each one. Process, the top one. It works, but only because one person remembers how. People: everyone’s clear on who does what, until someone leaves. Commercial: discounts agreed on a call and never written down. Finance: profit isn’t cash. You can be profitable and still not make payroll. We’ll do that properly in module 3. Legal: who actually owns your templates, your code, your content. Compliance: you’re following the rules, but you couldn’t show it if someone asked. Governance: nobody’s quite sure who’s allowed to say yes. And risk, at the bottom: the one client, supplier or person you really can’t afford to lose. Have a look down that list and notice which one made you wince a bit. And before we move on, think of one decision you made in the last month. A client, a hire, a price, a supplier. You’ll use it in the exercise."}, {"n": 10, "title": "One ball.", "chapter": "Chapter 2 · One ball", "text": "Chapter 2. About four minutes. This is why the eight only work as one thing, and who in your business is actually holding it all."}, {"n": 11, "title": "Eight panels. One ball.", "chapter": null, "text": "So this is why I call them panels. Think of a beach ball. Eight panels sewn together, and that’s operations. You can look at one panel at a time, but you can’t take one off and still have a ball. Every decision you make lands on the whole thing. A new client is a commercial decision, but it’s also a finance one, a people one, a legal one. You might just only be looking at one colour when you decide. [On paper: draw a circle, split it into eight, and write a name in each.]"}, {"n": 12, "title": "Things fall through the seams.", "chapter": null, "text": "Here’s what tends to happen as companies grow. They cut the ball up. Legal ops, finance ops, rev ops, people ops. And each team gets really good at its own panel, which is fine. The problem is each team only sees its own colour. Finance sees the payment terms. Legal sees the contract. Nobody sees that the payment terms, the contract and the staffing plan are all the same decision. So when you split the ball, you split who does the work, who answers for it, and who knows how it works. And in my experience, problems don’t sit on a panel. They sit in the gaps between them. Which is what the slide says: things fall through the seams."}, {"n": 13, "title": "One form. Four teams. Nobody told.", "chapter": null, "text": "Let me give you a real one. I worked at a regulated financial services scale-up, a couple of hundred people. After they changed regulator, the compliance team rewrote the client onboarding form. New requirements, extra paperwork for some long-standing clients. Fair enough, that’s a reasonable change. But they launched it on their own. The account managers didn’t know, so they couldn’t warn their clients. The ops team doing the onboarding didn’t know. Sales didn’t know. When I saw it, I flagged it. I said we need a change log, we need everyone affected in a room, and we need to tell clients before anything changes. And I told my manager and the chief compliance officer, we’re going to lose clients over this. And we did. Established clients, with significant money with us, who didn’t want to redo paperwork nobody had told them about. Afterwards, changes started going round the teams for input before they launched. And it properly tightened up once onboarding had its own team who owned the process. Because until then, the onboarding team was me. I was onboarding and offboarding everyone, and spotting problems that were never really my job to spot. But nobody got their own bit wrong. Compliance did compliance right. It went wrong in the gap between compliance, the commercial side and process. [Look up.] And what fixed it wasn’t another rule. It was an owner."}, {"n": 14, "title": "You’re holding the ball. Because nobody decided otherwise.", "chapter": null, "text": "Now, in most founder-led businesses, the founder is holding the ball. And nobody actually decided that. You set the first prices, you signed the first contracts, you hired the first people, and it all just stayed with you. Which works, for a while. It stops working when you’re the only person who can answer a question about any of the eight, and you’re also meant to be running the business."}, {"n": 15, "title": "How it usually changes as you grow", "chapter": null, "text": "This slide is roughly how that changes as you grow. Step one, top of the list: it’s just you, holding every panel. Then panels get helpers. A bookkeeper, a freelancer, an assistant. They do the work, but you still make the calls. Then panels get owners, people who make decisions within limits you’ve agreed. That’s the shift David talks about: handing over decisions, not just tasks. And eventually, someone who isn’t you holds the whole ball, usually an ops lead or a COO. Now, as it says at the bottom, it’s a common pattern, not a rule, and not every business needs that last step. What matters is being honest about which of your panels have owners, and which are still just you. And they’re rarely all at the same stage."}, {"n": 16, "title": "You can hand over the work. The business keeps the responsibility.", "chapter": null, "text": "And this is the one I really want you to remember. You can hand over the work. You can’t hand over the responsibility. If your bookkeeper files late, the company’s late. If a freelancer mishandles customer data, it’s your business that has to answer for it. So hand panels over, definitely. But you still need to know who has it, and how you’d know if it was going wrong. And that’s actually the last column on your map: how would you know it’s slipping?"}, {"n": 17, "title": "Turn the ball.", "chapter": "Chapter 3 · Turn the ball", "text": "Chapter 3, about four minutes. This is where we take one real decision and turn it all the way round."}, {"n": 18, "title": "Back to Kestrel. Now turn the ball", "chapter": null, "text": "So, back to Kestrel. From the commercial panel, it’s the best deal they’ve ever had. Now let’s turn it, and I’ve put each panel down the left. Finance: the client pays in 90 days, but venues want deposits up front. So Kestrel is basically funding the client’s events for three months. People: the team’s already full, so they’ll need freelancers, which means contracts and onboarding. Process: the client wants to sign off every single event, which adds a step to everything. Legal: the contract gives the client all the creative work, including templates Kestrel has used for years. Compliance: attendee personal data would end up on staff’s personal drives. Governance: the founder agreed it alone, on a call, and nobody else knew. And risk, at the bottom: this one client would be half their revenue. And that’s what the line at the bottom of the slide is saying. Same deal, seven more things to know. So, would you still sign it?"}, {"n": 19, "title": "Say yes knowingly.", "chapter": null, "text": "And to be clear, the point isn’t to say no. It might still be a great deal. The point is to say yes knowingly, and change what you can, which is the line on screen. So push for better payment terms, or a deposit. Get your templates taken out of the IP clause. Move the data somewhere it should be. Agree who signs off on deals this size. And decide, properly, whether you can live with one client being half the business. Just so you know, the legal and data points here are examples, not legal advice. If it’s a real contract, get it checked."}, {"n": 20, "title": "Eight questions to turn any decision", "chapter": null, "text": "So how do you do this without a meeting? These are the eight questions, one per panel, and they’re on your worksheet. Honestly, for most decisions this is five minutes with a notepad. I won’t read them all out. Let me just pick two. Finance, the fourth one down: when does cash go out, and when does it come in? That’s the one that would have caught Kestrel’s 90 days. And governance, second from the bottom: who’s allowed to decide this, and who needs to know? That’s the one that would have stopped it being agreed alone on a call."}, {"n": 21, "title": "Your turn · about 30 minutes, on the worksheet", "chapter": "Close", "text": "Okay, your turn. It’s about 30 minutes, and it’s all on the worksheet. One, on the slide: map your eight. For each part, write down the main work, one name for who looks after it, where it lives, how you’d know it was slipping, and whether it’s owned, only you, or you’re not sure. One name, not a team. And if it’s you, write me. Two: name your weakest part. The one you’d least want an investor to ask you about. And three: take that decision you thought of earlier, and run it through the eight questions. Be honest with it. Nobody’s marking this. It’s for you."}, {"n": 22, "title": "Which part did you not know was yours?", "chapter": null, "text": "Last thing, and it’s the question on screen. When you’ve done your map, ask yourself: which part did you not know was yours? Most founders find at least one. Bring that answer to module 2, because that’s where we start getting things out of your head. And if you do this properly, you’ll stop finding parts of your business by accident. See you in module 2."}];
const $ = s => document.querySelector(s);
const field = $('#field'), script = $('#script');
const store = {get(k,d){try{const v=localStorage.getItem('tp1.'+k);return v===null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('tp1.'+k,JSON.stringify(v))}catch(e){}}};
let speed = store.get('speed', 4), size = store.get('size', 56), running = false, last = 0, carry = 0, elapsed = 0, idleTimer;

function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function render(){
  const intro = document.createElement('div');
  intro.id='intro';
  intro.innerHTML='<b>Before you record.</b> In Loom, share only the deck’s window or tab, and keep this prompter on your other screen, so it never appears in the video. Press Start, or Space, when you begin talking. Pink boxes are stage directions, not lines. A blue “change slide” marks where you click to the next slide.';
  script.appendChild(intro);
  SLIDES.forEach((s,i)=>{
    if(s.chapter){const c=document.createElement('div');c.className='chapter';c.textContent=s.chapter;script.appendChild(c)}
    const b=document.createElement('section');b.className='block';b.id='s'+s.n;
    const said=esc(s.text).replace(/\[(.*?)\]/g,'<span class="cue">$1</span>');
    b.innerHTML='<div class="slide"><b>'+s.n+'</b><span>'+esc(s.title)+'</span>'+(i?'<span class="adv">change slide ▶</span>':'')+'</div><p class="say">'+said+'</p>';
    script.appendChild(b);
  });
  const e=document.createElement('p');e.className='end';e.textContent='End of module 1. Stop recording.';script.appendChild(e);
}
// speed levels: px per second at 56px text, scaled with text size
const LEVELS=[0,10,14,18,23,28,34,40,48,58,70];
function pxPerSec(){return LEVELS[speed]*(size/56)}
function applySize(){document.documentElement.style.setProperty('--size',size+'px');store.set('size',size)}
function showSpeed(){$('#speedVal').textContent=speed+' / 10';store.set('speed',speed)}
function blocks(){return [...script.querySelectorAll('.block')]}
function lineY(){return field.clientHeight*(document.body.classList.contains('camera')?0.16:0.30)}
function currentIndex(){const y=lineY()+field.scrollTop;let idx=0;blocks().forEach((b,i)=>{if(b.offsetTop<=y+4)idx=i});return idx}
function updateStatus(){const i=currentIndex();$('#slideNow').textContent='Slide '+SLIDES[i].n+' of '+SLIDES.length;const s=Math.floor(elapsed);$('#clock').textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function goTo(i){const bs=blocks();i=Math.max(0,Math.min(bs.length-1,i));field.scrollTop=bs[i].offsetTop-lineY();carry=0;updateStatus()}
function tick(t){
  if(!running)return;
  const dt=last?Math.min(0.1,(t-last)/1000):0; last=t; elapsed+=dt;
  carry+=pxPerSec()*dt; const whole=Math.floor(carry);
  if(whole){field.scrollTop+=whole;carry-=whole}
  if(field.scrollTop+field.clientHeight>=field.scrollHeight-2){setRunning(false)}
  updateStatus(); requestAnimationFrame(tick);
}
let wake=null;
async function lockScreen(on){try{if(on&&'wakeLock'in navigator){wake=await navigator.wakeLock.request('screen')}else if(wake){await wake.release();wake=null}}catch(e){}}
function setRunning(on){
  running=on; document.body.classList.toggle('running',on);
  $('#play').textContent=on?'Pause':(elapsed?'Resume':'Start');
  last=0; lockScreen(on); if(on){requestAnimationFrame(tick);poke()}
}
function poke(){document.body.classList.remove('idle');clearTimeout(idleTimer);idleTimer=setTimeout(()=>document.body.classList.add('idle'),2500)}
function full(){const d=document;try{if(!d.fullscreenElement)d.documentElement.requestFullscreen().catch(()=>{});else d.exitFullscreen().catch(()=>{})}catch(e){}}
function bump(n){speed=Math.max(1,Math.min(10,speed+n));showSpeed()}
function resize(n){const i=currentIndex();size=Math.max(28,Math.min(110,size+n));applySize();requestAnimationFrame(()=>goTo(i))}

function setCamera(on){const i=currentIndex();document.body.classList.toggle('camera',on);$('#cam').setAttribute('aria-pressed',String(on));store.set('camera',on);requestAnimationFrame(()=>goTo(i))}
let col=store.get('col',420), focus=store.get('focus',true);
function applyCol(){document.documentElement.style.setProperty('--col',col+'px');document.body.style.setProperty('--col',col+'px');$('#colVal').textContent=col+'px';store.set('col',col)}
function setFocus(on){focus=on;document.body.classList.toggle('focus',on);$('#focus').setAttribute('aria-pressed',String(on));store.set('focus',on)}
function widen(n){const i=currentIndex();col=Math.max(220,Math.min(1000,col+n));applyCol();requestAnimationFrame(()=>goTo(i))}
render(); applySize(); applyCol(); setFocus(focus); showSpeed(); document.body.classList.toggle('camera',store.get('camera',false)); $('#cam').setAttribute('aria-pressed',String(store.get('camera',false))); goTo(0);
$('#narrower').onclick=()=>widen(-40); $('#wider').onclick=()=>widen(40); $('#focus').onclick=()=>setFocus(!focus);
$('#cam').onclick=()=>setCamera(!document.body.classList.contains('camera'));
$('#play').onclick=()=>setRunning(!running);
$('#slower').onclick=()=>bump(-1); $('#faster').onclick=()=>bump(1);
$('#smaller').onclick=()=>resize(-6); $('#bigger').onclick=()=>resize(6);
$('#prev').onclick=()=>goTo(currentIndex()-1); $('#next').onclick=()=>goTo(currentIndex()+1);
$('#restart').onclick=()=>{setRunning(false);elapsed=0;goTo(0);$('#play').textContent='Start'};
$('#full').onclick=full;
field.addEventListener('scroll',()=>{if(!running)updateStatus()});
document.addEventListener('mousemove',poke);
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='BUTTON'&&(e.key===' '||e.key==='Enter'))return;
  const k=e.key;
  if(k===' '){e.preventDefault();setRunning(!running)}
  else if(k==='ArrowUp'){e.preventDefault();bump(1)}
  else if(k==='ArrowDown'){e.preventDefault();bump(-1)}
  else if(k==='ArrowRight'){e.preventDefault();goTo(currentIndex()+1)}
  else if(k==='ArrowLeft'){e.preventDefault();goTo(currentIndex()-1)}
  else if(k==='+'||k==='='){resize(6)}
  else if(k==='-'||k==='_'){resize(-6)}
  else if(k==='Home'){e.preventDefault();$('#restart').click()}
  else if(k==='f'||k==='F'){full()}
  else if(k==='['){widen(-40)}
  else if(k===']'){widen(40)}
  else if(k==='d'||k==='D'){setFocus(!focus)}
  else if(k==='c'||k==='C'){setCamera(!document.body.classList.contains('camera'))}
  else return;
  poke();
});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&running)lockScreen(true)});
</script>
