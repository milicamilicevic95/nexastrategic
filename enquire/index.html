<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Enquire | NexaStrategic</title><link href="/assets/ns-icon-32.png" rel="icon" type="image/png"/><link href="/assets/ns-icon-180.png" rel="apple-touch-icon"/><link href="/site.webmanifest" rel="manifest"/><link rel="stylesheet" href="/site.css"><style>.enquiry-standalone{display:block;max-width:680px;margin:6rem auto;padding:2rem;background:#f8f3ec}.enquiry-standalone form{display:grid;gap:12px}.enquiry-standalone input,.enquiry-standalone textarea,.enquiry-standalone select{width:100%;padding:12px}.dialog-close{display:none}</style></head><body><main><p style="padding:2rem"><a href="/">NexaStrategic</a></p><section class="enquiry-standalone"><div class="enquiry-head"><p class="eyebrow">Discuss an engagement</p><button aria-label="Close enquiry form" class="dialog-close" type="button">×</button></div><h2 id="enquiry-title">Tell me what needs fixing.</h2><p class="enquiry-intro">A few details are enough to start.</p><form accept-charset="UTF-8" action="/" data-netlify="true" method="POST" name="nexa-enquiry" netlify="" netlify-honeypot="bot-field"><input name="form-name" type="hidden" value="nexa-enquiry"/><p class="honeypot"><label>Leave blank <input name="bot-field"/></label></p><label for="enquiry-type">I'm interested in</label><select id="enquiry-type" name="engagement" required=""><option value="Implementation">Implementation</option><option value="Advisory">Advisory</option><option value="General">Not sure yet</option></select><div class="enquiry-row"><div><label for="enquiry-name">Name</label><input autocomplete="name" id="enquiry-name" name="name" required="" type="text"/></div><div><label for="enquiry-email">Work email</label><input autocomplete="email" id="enquiry-email" name="email" required="" type="email"/></div></div><label for="enquiry-company">Company</label><input autocomplete="organization" id="enquiry-company" name="company" required="" type="text"/><label for="enquiry-message">What's happening in the business?</label><textarea id="enquiry-message" name="message" required="" rows="4"></textarea><p class="enquiry-privacy">Your details will be used to respond to your enquiry. See the <a href="/privacy/">Privacy Policy</a>.</p><button class="button" type="submit">Send enquiry</button></form></section></main><script defer src="/netlify-enquiry.js"></script></body></html>
